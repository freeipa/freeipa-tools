[package]
summary = "FreeIPA developer workflow tool — review, push, and TUI for patch management"
description = """
ipatool is a command-line and terminal-UI tool for FreeIPA project contributors.
It automates the repetitive parts of reviewing and landing patches: fetching
patches, applying them, pushing to upstream git, updating issue trackers
(Pagure, Forgejo, Jira), and managing GitHub/Forgejo pull requests.

The interactive TUI (ipatool tui) lets contributors browse open pull requests,
inspect CI results, ACK or reject patches, and run the push pipeline — all from
the terminal.  An offline mode stores a local SQLite cache for disconnected work
and queues mutations for replay when connectivity is restored.
"""

# ipatool is not yet published to crates.io.
# Set url to the forge release tarball once a proper versioned release exists.
# url = "https://github.com/freeipa/freeipa-tools/archive/v{version}/ipatool-{version}.tar.gz"

doc-files = ["README.md"]
cargo-install-bin = true
cargo-install-lib = false

[requires]
# rusqlite uses the 'bundled' feature which statically compiles SQLite sources
# into the binary.  No system sqlite-devel build dependency is needed.
# See the bundled-SQLite discussion in the spec %description.
build = []

[tests]
# This is a binary-only crate with no lib target; doc-tests cannot run.
skip = ["doc"]
comments = [
    "Binary-only crate: no library doc-tests exist.",
]
